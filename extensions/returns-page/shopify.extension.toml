# Trekiva Returns & Exchanges: per-order full-page extension (ACCT-08).
# Reached from the "Request return or exchange" button on each order
# (see the return-action extension).
api_version = "2026-10"

[[extensions]]
name = "Trekiva Returns"
handle = "returns-page"
type = "ui_extension"
uid = "ff30f5d0-9fb0-5a43-ecde-994b61c741dcaca423b4"

[[extensions.targeting]]
module = "./src/ReturnsPage.jsx"
target = "customer-account.order.page.render"

[extensions.capabilities]
# Requests are sent to the Trekiva app backend, which checks eligibility.
network_access = true
