# Trekiva Wishlist: full-page customer account extension (ACCT-05).
api_version = "2026-10"

[[extensions]]
name = "Trekiva Wishlist"
handle = "wishlist-page"
type = "ui_extension"
uid = "bc7ed5a2-dae8-0291-b4b2-46fe268521762e1ba10a"

[[extensions.targeting]]
module = "./src/WishlistPage.jsx"
target = "customer-account.page.render"

[extensions.targeting.capabilities]
allow_direct_linking = true

[extensions.capabilities]
# Storefront API: refreshes title, price and stock for saved products.
api_access = true
# Network access: wishlist reads and writes go to the Trekiva app backend.
network_access = true
