# Trekiva Overview: full-page customer account extension (ACCT-01).
# A full-page target cannot share an extension with other targets, so each
# custom page (Wishlist, Support, ...) is generated as its own extension.
api_version = "2026-10"

[[extensions]]
name = "Trekiva Overview"
handle = "customer-account-dashboard"
type = "ui_extension"
uid = "f35a5700-6cf3-7b55-f782-e77aa1418ecdd1d9f5be"

[[extensions.targeting]]
module = "./src/OverviewPage.jsx"
target = "customer-account.page.render"

[extensions.targeting.capabilities]
allow_direct_linking = true
