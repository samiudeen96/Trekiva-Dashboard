# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "09f2982b40ffffec37de42fa4f989b4e"
application_url = "https://dashboard.trekiva.in"
embedded = true
name = "Trekiva Track Order"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_orders / read_customers: confirm an order belongs to the customer asking for its
# tracking, and read its fulfillments. Customer fields need protected customer data approval.
scopes = "read_orders,read_customers"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

# Makes the public "Track your order" page available on the storefront at
# https://<your store>/apps/track
[app_proxy]
url = "https://dashboard.trekiva.in/proxy"
subpath = "track"
prefix = "apps"

[auth]
redirect_urls = [ "https://dashboard.trekiva.in/api/auth" ]

[build]
automatically_update_urls_on_dev = true
